; Norden UI - Black's colours for Inventory Reforged for SkyUI (Nexus 195826), any version.
; Only the two colours are set here; every other setting keeps Inventory Reforged's own default, and what you set in its
; menu is kept in Data/MCM/Settings/InventoryReforged.ini and wins over this file, key by key.
; Installed by Norden UI - Black's "Inventory Reforged" option. To go back to its gold and parchment: iAccentColor = 14069864,
; iTextColor = 15130824 (or untick the option / delete this file).

[Look]
; the colour of what is picked, lit or counted: frames, headings, numbers, tabs. A colour 0xRRGGBB written as a decimal
; number; 12303807 is Norden's silver #BBBDBF
iAccentColor = 12303807
; the colour of names and signs at rest; 15066597 is Norden Black's soft white #E5E5E5
iTextColor = 15066597
