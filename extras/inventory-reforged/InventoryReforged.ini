; Inventory Reforged for SkyUI 1.2.4 (by its author, Nexus 195826) - its default settings file, with ONLY the [Look] colours changed to Norden UI - Black's palette.
; Installed by Norden UI - Black's "Inventory Reforged" option. The author allows reuse and modification of any part of the mod; credit: Inventory Reforged for SkyUI.
; What you set in the mod's menu is kept in Data/MCM/Settings/InventoryReforged.ini and wins over this file, key by key.
; To go back to the mod's gold and parchment: iAccentColor = 14069864, iTextColor = 15130824 (or untick the option).

; Inventory Reforged for SkyUI. With MCM Helper these are the starting numbers of the menu in the journal
; and the menu keeps what you set in Data/MCM/Settings/InventoryReforged.ini, which wins over this file

[Panel]
; 0 leaves the item menus of SkyUI as they are and shows the pieces of hidden slots while it stays 0,
; they are remembered and hide again with 1
bEnabled = 1
; with mods that keep the world running under menus, like Skyrim Souls RE, the camera stays still while the
; inventory is open. 0 lets the pointer at an edge of the screen or a stick turn it as that mod does
bStillCamera = 1
; the item list of the inventory: 0 at its full width, 1 narrow, 2 narrower, the panel takes the room it gives
iListWidth = 0

[Doll]
; the 3D character between the columns of slots
bShow = 1
; 0 standing calm and straight whatever you do when the menu opens, 1 the pose of that moment
iPose = 0
; degrees the character turns for a pixel of a drag across it
fTurnSpeed = 0.5
; the size of the character in percent of the size that fits its room, 60 to 140
iScale = 100
; how far the character stands right of the middle of its room in percent of the room's width, -40 to 40
iShiftRight = 0
; how far the character stands above the middle of its room in percent of the room's height, -40 to 40
iShiftUp = 0

[Slots]
; 3D models of what you wear, 0 flat signs
bModels = 1
; armor, jewelry and cloaks shown as they sit on the body, 0 their model on the ground
bWornLook = 1
; the eye in the corner of a slot that hides its piece on the character
bHideIcons = 1
; a click on a slot opens the item window beside it
bPopup = 1
; a double click on a slot takes its piece off
bDoubleClickTakesOff = 1
; rows of the list can be dragged onto slots and the character
bDragAndDrop = 1
; a slot with several pieces pulls out a strip of small slots, one for every piece
bPieceStrips = 1
; the slots of the panel, 0 takes a slot off the panel. What you wear there stays worn
bShowRight = 1
bShowLeft = 1
bShowAmmo = 1
bShowAmulet = 1
bShowRing = 1
bShowHead = 1
bShowBody = 1
bShowHands = 1
bShowFeet = 1
bShowOther = 1

[List]
; arrows that compare an item with what you wear in its place
bArrows = 1
; a grey = for an item that gives the same
bEqualSign = 1
; the sign of its slot on a row you could wear
bBadges = 1
; a strip under weapons and apparel: one handed, two handed, light, heavy, head and so on
bSubcategories = 1
; a right click on a row opens its menu: equip, use, drop, take, store, buy, sell, some or all of a stack
bRowMenu = 1
; this key moves the whole stack of the row under the pointer in a container or a shop, scan code, 45 is X, 0 for none
iStackKey = 45
; the name column sorts by what you got last
bLastAdded = 1
; the weight column sorts by whole stacks
bStackWeight = 1
; a small dot on what you got since you last closed the inventory, on its row and its subcategory
bNewMarks = 1
; a small sign after the name of what a quest wants: gold while it's needed, dim gold for a quest not begun, grey
; once the quest is done
bQuestMarks = 1
; junk marks: the menu of a row or the junk key marks an item as junk, chests store and shops buy all junk at once.
; Never what you wear, a favorite or what a quest wants
bJunk = 1
; this key marks the row under the pointer as junk or not, scan code, 36 is J, 0 for none
iJunkKey = 36
; in a chest or a shop the weight of a row is red when taking it would slow you, a subcategory tells what it weighs
bWeightWarnings = 1

[Window]
; the item window with its card in percent, 70 to 160. At 100 it takes about half the list and never less than
; four tenths of the screen's height
iSize = 100
; swing time, DPS, DPM, reach and stagger of weapons, the share of a hit armor stops
bStats = 1
; the tab at the feet of your character that pulls your numbers up over it
bHeroStats = 1
; a small grey line in the window of a piece you wear with the body slots it takes, like Slots 32, 46
bSlotNumbers = 0
; quiet lines in the window: what a quest wants with the item, how many you have, silver, the plugin it comes from
bQuietTags = 1

[Inspect]
; the item zoom key opens the full screen inspect view of the panel
bOnZoomKey = 1

[Look]
; the colour of what is picked, lit or counted: frames, headings, numbers, tabs. A colour 0xRRGGBB written as
; a decimal number, 14069864 is the gold the mod comes with; 12303807 is Norden's silver #BBBDBF (set here)
iAccentColor = 12303807
; the colour of names and signs at rest, 15130824 is the pale parchment the mod comes with
iTextColor = 15066597

[Debug]
; writes the pose of the live player into SKSE/InventoryReforged-pose-male.txt or -female.txt on every menu open
bDumpPose = 0
