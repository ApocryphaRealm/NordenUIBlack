; Norden UI - Black's look for World Map Selector for Controller's map list panel.
; World Map Selector for Controller reads this file when it is there (any version that has the panel style); without it
; the panel wears the Apocrypha Menu Framework's theme as before. Installed by Norden UI - Black's
; "World Map Selector for Controller" option. To go back to the framework's theme, untick the option or delete this file.
; Colours are #RRGGBB or #RRGGBBAA. Every value is read from Norden UI - Black's own movies:
[PanelStyle]
sName = Norden UI - Black
; the panel: black, opaque - Norden Black's item card body and the Inventory Reforged panel option's fills (0,0,0 at 100%)
sBackground = #000000FF
; row text: the item list's entry text (skyui/inventorylists.swf, white)
sText = #FFFFFF
; the hint line: the item card's label text (skyui/itemcard.swf, #999999)
sTextDim = #999999
; the panel's edge lines and separators: the item card's edge line (skyui/itemcard.swf, 91,103,109)
sLine = #5B676D
; the scroll bar: the same line colour
sScrollbar = #5B676D
; the highlighted row: the item list's selection indicator (skyui/inventorylists.swf, ItemsListEntry selectIndicator) -
; a slate band (43,52,57 at 35%), lines along its top and bottom (248,248,248 at 45%, fading out to the right) and a
; thin mark at its left end (252,252,252 at 31%)
sHighlightBand = #2B343959
sHighlightLine = #F8F8F873
sHighlightMark = #FCFCFC4E
; Norden's own edge lines instead of the framework theme's frame
bThemeFrame = false
fLineThickness = 1.0
